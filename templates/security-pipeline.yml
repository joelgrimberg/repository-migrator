# Security pipeline applied by repository-migrator.
# Edit templates/security-pipeline.yml in the migrator repo and rebuild
# (`go build ./...`) to change what gets committed onto target repos.

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages:
  - test

sast:
  stage: test

secret_detection:
  stage: test

dependency_scanning:
  stage: test
