  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest
    # needs: changes
    # if: ${{ needs.changes.outputs.release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.7.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    name: Publish APT Repository (gh-pages)
    needs: goreleaser
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: robinraju/release-downloader@v1.10
        with:
          tag: ${{ github.ref_name }}
          out-file-path: debs
          fileName: '*linux_*.deb'

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Import GPG key
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | base64 -d > private.key
          gpg --batch --import private.key

      - name: Export public key to docs/apt/public.key
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          mkdir -p docs/apt
          # export all public keys; ideally scope to your signing key
          gpg --armor --export > docs/apt/public.key

      - name: Build repo under docs/apt on main
        run: |
          set -euo pipefail
          REPO_DIR=docs/apt
          mkdir -p "$REPO_DIR/conf" "$REPO_DIR"
          # ensure Pages serves as static (no Jekyll processing)
          touch docs/.nojekyll
          cat > "$REPO_DIR/conf/distributions" <<EOF
          Origin: repository-migrator
          Label: repository-migrator
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: Repository Migrator APT repo
          SignWith: yes
          EOF
          cd "$REPO_DIR"
          for deb in ../../debs/*.deb; do
            reprepro --basedir . includedeb stable "$deb"
          done
      - name: Commit APT repo to docs/ on main
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            docs/apt
          message: "chore(apt): update APT repo for ${{ github.ref_name }}"
          branch: main
          push: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

