  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest
    # needs: changes
    # if: ${{ needs.changes.outputs.release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          # Checkout the tag that triggered the workflow so GoReleaser sees the correct tag/commit
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.7.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    name: Publish APT Repository (gh-pages)
    needs: goreleaser
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release assets
        uses: robinraju/release-downloader@v1.10
        with:
          tag: ${{ github.ref_name }}
          out-file-path: debs
          fileName: '*.deb'

      - name: Verify deb files downloaded
        run: |
          if [ ! -d debs ] || [ -z "$(ls -A debs/*.deb 2>/dev/null)" ]; then
            echo "Error: No .deb files found in debs directory"
            exit 1
          fi
          echo "Found .deb files:"
          ls -lh debs/*.deb

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Import GPG key
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | base64 -d > private.key
          gpg --batch --import private.key

      - name: Export public key to docs/apt/public.key
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          mkdir -p docs/apt
          # export all public keys; ideally scope to your signing key
          gpg --armor --export > docs/apt/public.key

      - name: Build repo under docs/apt on main
        run: |
          set -euo pipefail
          REPO_DIR=docs/apt
          mkdir -p "$REPO_DIR/conf" "$REPO_DIR"
          # ensure Pages serves as static (no Jekyll processing)
          touch docs/.nojekyll
          cat > "$REPO_DIR/conf/distributions" <<EOF
          Origin: repository-migrator
          Label: repository-migrator
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: Repository Migrator APT repo
          SignWith: yes
          EOF
          cd "$REPO_DIR"
          for deb in ../../debs/*.deb; do
            if [ -f "$deb" ]; then
              echo "Adding $deb to repository..."
              pkg=$(dpkg-deb -f "$deb" Package)
              ver=$(dpkg-deb -f "$deb" Version)
              echo "Processing package: $pkg version: $ver"
              # If same version already exists, remove it to avoid checksum mismatch
              if reprepro --basedir . list stable "$pkg" | grep -q " $ver "; then
                echo "Existing $pkg $ver found in 'stable'; removing before re-adding..."
                reprepro --basedir . remove stable "$pkg" || true
                # Clean unreferenced files from pool
                reprepro --basedir . deleteunreferenced || true
              fi
              reprepro --basedir . includedeb stable "$deb"
            fi
          done
          # Verify pool directory was created
          if [ ! -d "pool" ]; then
            echo "Error: pool directory was not created"
            exit 1
          fi
          echo "Pool directory structure:"
          find pool -type f -name "*.deb" || echo "No .deb files found in pool"
      - name: Verify files before commit
        run: |
          echo "Checking what files exist in docs/apt:"
          find docs/apt -type f | head -20
          echo ""
          echo "Checking pool directory:"
          ls -la docs/apt/pool/main/r/repository-migrator/ 2>&1 || echo "Pool directory not found"
          echo ""
          echo "Checking git status:"
          git status --porcelain docs/apt/ | head -20
      - name: Commit APT repo to docs/ on main
        run: |
          set -e
          # Configure git for pushing
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Explicitly add all files in docs/apt including pool directory
          git add -f docs/apt/ docs/.nojekyll
          # Verify pool files are staged
          echo "Staged files:"
          git diff --cached --name-only | grep "docs/apt" | head -20
          # Commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(apt): update APT repo for ${{ github.ref_name }}"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

