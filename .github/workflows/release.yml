  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # needs: changes
    # if: ${{ needs.changes.outputs.release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          # Checkout the tag that triggered the workflow so GoReleaser sees the correct tag/commit
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.7.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    name: Publish APT Repository (gh-pages)
    needs: goreleaser
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release assets
        uses: robinraju/release-downloader@v1.10
        with:
          tag: ${{ github.ref_name }}
          out-file-path: debs
          fileName: '*.deb'

      - name: Verify deb files downloaded
        run: |
          if [ ! -d debs ] || [ -z "$(ls -A debs/*.deb 2>/dev/null)" ]; then
            echo "Error: No .deb files found in debs directory"
            exit 1
          fi
          echo "Found .deb files:"
          ls -lh debs/*.deb

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Import GPG key
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | base64 -d > private.key
          gpg --batch --import private.key

      - name: Export public key to docs/apt/public.key
        if: ${{ env.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          mkdir -p docs/apt
          # export all public keys; ideally scope to your signing key
          gpg --armor --export > docs/apt/public.key

      - name: Build repo under docs/apt on main
        run: |
          set -euo pipefail
          REPO_DIR=docs/apt
          mkdir -p "$REPO_DIR/conf" "$REPO_DIR"
          # ensure Pages serves as static (no Jekyll processing)
          touch docs/.nojekyll
          cat > "$REPO_DIR/conf/distributions" <<EOF
          Origin: repository-migrator
          Label: repository-migrator
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: Repository Migrator APT repo
          SignWith: yes
          EOF
          cd "$REPO_DIR"
          for deb in ../../debs/*.deb; do
            if [ -f "$deb" ]; then
              echo "Adding $deb to repository..."
              pkg=$(dpkg-deb -f "$deb" Package)
              ver=$(dpkg-deb -f "$deb" Version)
              echo "Processing package: $pkg version: $ver"
              # Always try to remove existing package to avoid checksum mismatches
              # This is safe even if the package doesn't exist (errors are ignored)
              echo "Removing any existing $pkg from 'stable'..."
              reprepro --basedir . remove stable "$pkg" || true
              # Clean unreferenced files from pool to ensure clean state
              reprepro --basedir . deleteunreferenced || true
              # Add the package (will fail if file is corrupted, but that's expected)
              reprepro --basedir . includedeb stable "$deb"
            fi
          done
          # Verify pool directory was created
          if [ ! -d "pool" ]; then
            echo "Error: pool directory was not created"
            exit 1
          fi
          echo "Pool directory structure:"
          find pool -type f -name "*.deb" || echo "No .deb files found in pool"
      - name: Verify files before commit
        run: |
          echo "Checking what files exist in docs/apt:"
          find docs/apt -type f | head -20
          echo ""
          echo "Checking pool directory:"
          ls -la docs/apt/pool/main/r/repository-migrator/ 2>&1 || echo "Pool directory not found"
          echo ""
          echo "Checking git status:"
          git status --porcelain docs/apt/ | head -20
      - name: Commit APT repo to docs/ on main
        run: |
          set -e
          # Configure git for pushing
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Rebase onto latest main to avoid non-FF push when multiple jobs modify docs/
          git fetch origin main
          git checkout main
          git pull --rebase origin main || true
          # Explicitly add all files in docs/apt including pool directory
          git add -f docs/apt/ docs/.nojekyll
          # Verify pool files are staged
          echo "Staged files:"
          git diff --cached --name-only | grep "docs/apt" | head -20
          # Commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(apt): update APT repo for ${{ github.ref_name }}"
            # Retry push once on non-FF
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yum-repo:
    name: Publish YUM Repository (gh-pages)
    needs: apt-repo
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    env:
      YUM_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release assets
        uses: robinraju/release-downloader@v1.10
        with:
          tag: ${{ github.ref_name }}
          out-file-path: rpms
          fileName: '*.rpm'

      - name: Verify rpm files downloaded
        run: |
          if [ ! -d rpms ] || [ -z "$(ls -A rpms/*.rpm 2>/dev/null)" ]; then
            echo "Error: No .rpm files found in rpms directory"
            exit 1
          fi
          echo "Found .rpm files:"
          ls -lh rpms/*.rpm

      - name: Install createrepo_c and gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c gnupg

      - name: Import GPG key
        if: ${{ env.YUM_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$YUM_GPG_PRIVATE_KEY" | base64 -d > private.key
          gpg --batch --import private.key

      - name: Export public key to docs/yum/public.key
        if: ${{ env.YUM_GPG_PRIVATE_KEY != '' }}
        run: |
          mkdir -p docs/yum
          gpg --armor --export > docs/yum/public.key

      - name: Build YUM repo under docs/yum
        run: |
          set -euo pipefail
          REPO_DIR=docs/yum
          mkdir -p "$REPO_DIR"
          touch docs/.nojekyll
          # Copy RPMs directly to repo directory (createrepo_c expects them there)
          cp rpms/*.rpm "$REPO_DIR/"
          # Create repository metadata
          cd "$REPO_DIR"
          createrepo_c --update .
          # GPG sign the repository metadata (non-interactive)
          if [ -n "$YUM_GPG_PRIVATE_KEY" ]; then
            gpg --batch --yes --no-tty --pinentry-mode loopback \
              --detach-sign --armor repodata/repomd.xml
          fi
          echo "YUM repository structure:"
          find . -type f | head -20

      - name: Verify files before commit
        run: |
          echo "Checking what files exist in docs/yum:"
          find docs/yum -type f | head -20
          echo ""
          echo "Checking git status:"
          git status --porcelain docs/yum/ | head -20

      - name: Commit YUM repo to docs/ on main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Rebase onto latest main to avoid non-FF push when multiple jobs modify docs/
          git fetch origin main
          git checkout main
          git pull --rebase origin main || true
          git add -f docs/yum/ docs/.nojekyll
          echo "Staged files:"
          git diff --cached --name-only | grep "docs/yum" | head -20
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(yum): update YUM repo for ${{ github.ref_name }}"
            # Retry push once on non-FF
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

