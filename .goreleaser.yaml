project_name: gerrit-migrator

before:
  hooks:
    - go mod tidy

builds:
  - id: gerrit-migrator
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: tarballs
    format: tar.gz
    builds: [gerrit-migrator]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md

nfpms:
  - id: deb
    package_name: gerrit-migrator
    formats: [deb]
    maintainer: Maintainers <noreply@example.com>
    description: Git repository migrator to GitLab with safe FF mode and mirroring
    homepage: https://github.com/OWNER/REPO
    license: MIT
    vendor: Gerrit Migrator
    section: utils
    priority: optional
    recommends:
      - git
    contents:
      - src: ./dist/gerrit-migrator_{{ .Version }}_linux_{{ .Arch }}/gerrit-migrator
        dst: /usr/bin/gerrit-migrator
        file_info:
          mode: 0755
    bindir: /usr/bin

release:
  github:
    owner: OWNER
    name: REPO
  draft: false
  prerelease: auto

changelog:
  sort: asc
  use: git

